openapi: 3.0.3
info:
  title: Sample Pet Store
  version: 1.0.0
  description: A small sample spec used to demo the OAS Automation Test Suite.
servers:
  - url: https://api.example.com/v1
security:
  - bearerAuth: []
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [available, pending, sold]
        - name: X-Client-Id
          in: header
          required: true
          schema:
            type: string
            minLength: 3
      responses:
        '200':
          description: OK
    post:
      operationId: createPet
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 40
                category:
                  type: string
                  enum: [dog, cat, bird]
                age:
                  type: integer
                  minimum: 0
                  maximum: 30
                email:
                  type: string
                  format: email
      responses:
        '201':
          description: Created
  /pets/{petId}:
    get:
      operationId: getPet
      summary: Get a pet by id
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: OK
        '404':
          description: Not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
