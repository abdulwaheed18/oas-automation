# ======================================================================
#  OAS Automation Test Suite - configuration
# ======================================================================
spring.application.name=oas-automation
server.port=8080

# ----------------------------------------------------------------------
#  BRANDING / WHITE-LABEL
#  Change these to re-brand the tool for your company. No code changes
#  are needed - the UI title, header, footer and report all read these.
# ----------------------------------------------------------------------
oas.branding.app-name=OAS Automation Test Suite
oas.branding.company=Generic
oas.branding.tagline=Validate that your gateway enforces the OpenAPI contract
oas.branding.primary-color=#4f46e5
oas.branding.support-contact=

# ----------------------------------------------------------------------
#  EXPECTED STATUS CODES (defaults; also editable per-run from the UI)
#  Comma-separated list of individual codes and/or inclusive ranges,
#  e.g. 200,201,202,204  or  400-499  or  400,401,403,422,429
# ----------------------------------------------------------------------
# Tyk returns 422 when its OpenAPI validation rejects a request — that is the signal that the
# gateway enforced the contract. Broaden reject-codes (e.g. 400,422) if your gateway differs.
oas.testing.success-codes=200,201,202,204
oas.testing.reject-codes=422
oas.testing.auth-reject-codes=401,403
oas.testing.robustness-codes=100-499

# ----------------------------------------------------------------------
#  Upload limits (raise if your specs are large)
# ----------------------------------------------------------------------
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Pretty JSON responses for readability
spring.jackson.serialization.indent-output=false
