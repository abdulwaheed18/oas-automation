# ======================================================================
#  OAS Automation Test Suite - configuration
# ======================================================================
spring.application.name=oas-automation
server.port=8080

# ----------------------------------------------------------------------
#  BRANDING / WHITE-LABEL
#  Change these to re-brand the tool for your company. No code changes
#  are needed - the UI title, header, footer and report all read these.
# ----------------------------------------------------------------------
oas.branding.app-name=OAS Automation Test Suite
oas.branding.company=Generic
oas.branding.tagline=Validate that your gateway enforces the OpenAPI contract
oas.branding.primary-color=#4f46e5
oas.branding.support-contact=

# ----------------------------------------------------------------------
#  Upload limits (raise if your specs are large)
# ----------------------------------------------------------------------
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Pretty JSON responses for readability
spring.jackson.serialization.indent-output=false
